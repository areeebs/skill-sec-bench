name: benchmark

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate corpus integrity
        run: python3 harness/run_benchmark.py --self-test
      - name: Run baseline scanner
        run: python3 harness/run_benchmark.py
